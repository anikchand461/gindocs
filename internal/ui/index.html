<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{.CSSURL}}">
</head>
<body data-spec="{{.SpecURL}}">
  <header class="top">
    <div class="top-row">
      <div class="top-title">
        <h1 id="title">{{.Title}}</h1>
        <div id="meta" class="meta"></div>
      </div>
      <div id="actions" class="actions-top"></div>
    </div>
    <div id="info" class="info md"></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <label class="search">
        <input id="search" type="search" placeholder="Filter routes and schemas" aria-label="Filter routes and schemas" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <nav id="nav" aria-label="Routes"></nav>
    </aside>
    <main id="main"><p class="muted loading">Loading…</p></main>
  </div>
  <script src="{{.JSURL}}"></script>
</body>
</html>
