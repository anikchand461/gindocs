<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("gindocs.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{.CSSURL}}">
</head>
<body data-spec="{{.SpecURL}}">
  <header class="top">
    <button id="menu" class="icon-btn menu" type="button" aria-label="Show routes" aria-expanded="false" aria-controls="sidebar">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="title">{{.Title}}</h1>
    <div id="meta" class="meta"></div>
    <div class="bar-end">
      <div id="actions" class="actions-top"></div>
      <button id="theme" class="icon-btn" type="button" aria-label="Switch theme"></button>
      <a class="icon-btn" href="https://github.com/anikchand461/gin-autodocs" target="_blank" rel="noopener" aria-label="gin-autodocs on GitHub" title="gin-autodocs on GitHub">
        <svg class="icon fill" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>
  <div id="info" class="info md"></div>
  <div class="layout">
    <div id="backdrop" class="backdrop"></div>
    <aside id="sidebar" class="sidebar" aria-label="Routes">
      <div class="drawer-head">
        <span>Routes</span>
        <button id="close-nav" class="icon-btn" type="button" aria-label="Close routes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="drawer-meta" class="meta drawer-meta"></div>
      <label class="search">
        <input id="search" type="search" placeholder="Filter routes and schemas" aria-label="Filter routes and schemas" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <nav id="nav"></nav>
    </aside>
    <main id="main"><p class="muted loading">Loading…</p></main>
  </div>
  <script src="{{.JSURL}}"></script>
</body>
</html>
